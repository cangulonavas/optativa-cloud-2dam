name: Deploy MkDocs
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Instalar MkDocs y dependencias
        run: |
          pip install mkdocs
          # Descomenta la siguiente línea si usas el tema Material de MkDocs:
          # pip install mkdocs-material
      - name: Compilar y Desplegar
        run: mkdocs gh-deploy --force
